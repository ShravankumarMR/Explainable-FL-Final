project:
  name: explainable-fl
  environment: dev
  random_seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models_dir: models
  reports_dir: reports

ingestion:
  active_dataset: ieee_cis_fraud
  validate_schema: true
  datasets:
    ieee_cis_fraud:
      base_dir: IEEE-CIS-FRAUD
      train_transaction_file: train_transaction.csv
      train_identity_file: train_identity.csv
      test_transaction_file: test_transaction.csv
      test_identity_file: test_identity.csv
      merge_key: TransactionID
      required_transaction_columns: [TransactionID]
      required_identity_columns: [TransactionID]
      output_train_parquet: train_merged.parquet
      output_test_parquet: test_merged.parquet
      report_file: ingestion_report.yaml

preprocessing:
  target_column: target
  drop_columns: []
  missing_value_strategy: median
  scale_numeric: true
  categorical_encoding: onehot

feature_engineering:
  enabled: true
  selected_features: []
  create_interactions: false
  polynomial_degree: 1
  artifacts_subdir: feature_engineering
  transaction_dt:
    enabled: true
    source_column: TransactionDT
    hour_feature: transaction_hour
    weekday_feature: transaction_weekday
    weekend_feature: is_weekend
    weekend_days: [5, 6]
  log_transaction_amount:
    enabled: true
    source_column: TransactionAmt
    output_column: log_transaction_amt
  missing_indicators:
    enabled: true
    columns: [TransactionAmt, DeviceType, DeviceInfo, P_emaildomain, R_emaildomain]
    prefix: is_missing__
  count_encoding:
    enabled: true
    columns: [card1, card2, addr1, addr2, P_emaildomain, R_emaildomain, DeviceType, DeviceInfo]
    suffix: __count
    fill_value: 0.0
  frequency_encoding:
    enabled: true
    columns: [card1, card2, addr1, addr2, P_emaildomain, R_emaildomain, DeviceType, DeviceInfo]
    suffix: __freq
    fill_value: 0.0
  aggregations:
    device:
      enabled: true
      group_columns: [DeviceType, DeviceInfo]
      value_columns: [TransactionAmt]
      stats: [mean, std]
    email:
      enabled: true
      group_columns: [P_emaildomain, R_emaildomain]
      value_columns: [TransactionAmt]
      stats: [mean, std]
    card:
      enabled: true
      group_columns: [card1, card2, card3, card5]
      value_columns: [TransactionAmt]
      stats: [mean, std]
    address:
      enabled: true
      group_columns: [addr1, addr2]
      value_columns: [TransactionAmt]
      stats: [mean, std]
  interactions:
    enabled: true
    pairs:
      - left: card1
        right: addr1
        op: concat
        name: card1_x_addr1
      - left: TransactionAmt
        right: transaction_hour
        op: divide
        name: amt_per_hour

model_parameters:
  algorithm: random_forest
  hyperparameters:
    n_estimators: 200
    max_depth: 12
    min_samples_split: 2

evaluation:
  metrics: [accuracy, precision, recall, f1]
  test_size: 0.2
  cross_validation_folds: 5

profiling:
  enabled: true
  include_train: true
  include_test: true
  high_cardinality_ratio: 0.8

eda:
  enabled: true
  include_train: true
  include_test: true
  target_column: isFraud
  sample_size: 20000
  max_numerical_features: 20
  max_categorical_features: 16
  max_category_levels: 12
  correlation_top_n: 40
  pca_components: 2
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  feature_importance_top_n: 20
  random_state: 42

run:
  mode: train  # ingest | train | infer | profile | eda
  experiment_name: baseline

logging:
  config_path: configs/logging.yaml
  level: INFO

pipelines:
  ingest:
    enabled: true
  train:
    enabled: true
  infer:
    enabled: true
  profile:
    enabled: true
  eda:
    enabled: true
