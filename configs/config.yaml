project:
  name: explainable-fl
  environment: dev
  random_seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models_dir: models
  reports_dir: reports

preprocessing:
  target_column: target
  drop_columns: []
  missing_value_strategy: median
  scale_numeric: true
  categorical_encoding: onehot

feature_engineering:
  selected_features: []
  create_interactions: false
  polynomial_degree: 1

model_parameters:
  algorithm: random_forest
  hyperparameters:
    n_estimators: 200
    max_depth: 12
    min_samples_split: 2

evaluation:
  metrics: [accuracy, precision, recall, f1]
  test_size: 0.2
  cross_validation_folds: 5

run:
  mode: train  # train | infer
  experiment_name: baseline

logging:
  config_path: configs/logging.yaml
  level: INFO

pipelines:
  train:
    enabled: true
  infer:
    enabled: false
